name: Apache Syncope CI - Modulo 2

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compilazione Blindata
      run: mvn clean compile -Dmaven.test.skip=true -Denforcer.skip=true -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.compiler.source=21 -Dmaven.compiler.target=21 -Dmaven.compiler.release=21
