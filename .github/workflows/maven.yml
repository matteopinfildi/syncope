name: Apache Syncope CI - Build and Validation

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Compilazione e Installazione
        run: >
          mvn clean install -B -T 1C
          -DskipTests
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Djacoco.skip=true
          -Dmaven.javadoc.skip=true
          -Dstrict=false
          -Djava.net.preferIPv4Stack=true

      - name: Esecuzione Test Unitari, LLM e Randoop
        run: >
          mvn test -B -T 1C
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dmaven.javadoc.skip=true
          -Dstrict=false
          -DfailIfNoTests=false
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djava.net.preferIPv4Stack=true
          -Dtest=ResourceLogicCFTest,ResourceLogicBBTest,ResourceLogicLLMFew2Test,ResourceLogicLLMFewTest,ResourceLogicLLMToTTest,ResourceLogicLLMToT2Test,ResourceLogicLLMZeroTest,ResourceLogicPITTest,ResourceLogicRandoopRunTest,ResourceLogicRandoopTest,DefaultRealmPullResultHandlerBBTest,DefaultRealmPullResultHandlerCFTest,DefaultRealmPullResultHandlerLLMFew1Test,DefaultRealmPullResultHandlerLLMFew2Test,DefaultRealmPullResultHandlerLLMToT1Test,DefaultRealmPullResultHandlerLLMToT2Test,DefaultRealmPullResultHandlerLLMZeroTest,DefaultRealmPullResultHandlerPITTest,DefaultRealmPullResultHandlerRandoopRunTest,DefaultRealmPullResultHandlerRandoopTest

      - name: Esecuzione Integration Tests
        run: >
          mvn verify -B
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dmaven.javadoc.skip=true
          -Dstrict=false
          -DfailIfNoTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Djava.net.preferIPv4Stack=true
          -Dit.test=ResourceLogicITTest,DefaultRealmPullResultHandlerITTest