name: Apache Syncope CI - Build and Validation

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: maven

      - name: Configurazione EvoSuite
        run: |
          echo '<project><modelVersion>4.0.0</modelVersion><groupId>org.evosuite</groupId><artifactId>evosuite</artifactId><version>1.2.0</version><packaging>pom</packaging></project>' > dummy-parent.xml
          mvn install:install-file -Dfile=dummy-parent.xml -DgroupId=org.evosuite -DartifactId=evosuite -Dversion=1.2.0 -Dpackaging=pom
            
          wget https://github.com/EvoSuite/evosuite/releases/download/v1.2.0/evosuite-standalone-runtime-1.2.0.jar -O evosuite-runtime.jar
          mvn install:install-file -Dfile=evosuite-runtime.jar -DgroupId=org.evosuite -DartifactId=evosuite-standalone-runtime -Dversion=1.2.0 -Dpackaging=jar -DgeneratePom=true

      - name: Build del progetto (senza test)
        run: >
          mvn clean install -B -T 1C
          -pl :syncope-core-idm-logic,:syncope-core-provisioning-java -am
          -DskipTests
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dtools.verify-legal-files.skip=true
          -Dlegal.skip=true
          -Djava.net.preferIPv4Stack=true

      - name: Esecuzione Test Unitari e LLM
        run: >
          mvn test -B -T 1C
          -pl :syncope-core-idm-logic,:syncope-core-idrepo-logic,:syncope-core-provisioning-java
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dtools.verify-legal-files.skip=true
          -Dlegal.skip=true
          -DfailIfNoTests=false
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djava.net.preferIPv4Stack=true
          -Dtest=ResourceLogicBBTest,ResourceLogicCFTest,ResourceLogicESTest,ResourceLogicLLMGTest,ResourceLogicLLMZeroTest,ResourceLogicPITTest,ResourceLogicRandoopRunTest,ResourceLogicRandoopTest,DefaultRealmPullResultHandlerBBTest,DefaultRealmPullResultHandlerCFTest,DefaultRealmPullResultHandlerLLMGTTest,DefaultRealmPullResultHandlerLLMZeroTest,DefaultRealmPullResultHandlerPITTest,DefaultRealmPullResultHandlerRandoopRunTest,DefaultRealmPullResultHandlerRandoopTest,DefaultRealmPullResultHandlerESTest

      - name: Esecuzione Integration Tests
        run: >
          mvn test-compile failsafe:integration-test failsafe:verify -B -T 1C
          -pl :syncope-core-idm-logic,:syncope-core-idrepo-logic,:syncope-core-provisioning-java
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dtools.verify-legal-files.skip=true
          -Dlegal.skip=true
          -DfailIfNoTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Djava.net.preferIPv4Stack=true
          -Dit.test=ResourceLogicITTest,DefaultRealmPullResultHandlerITTest