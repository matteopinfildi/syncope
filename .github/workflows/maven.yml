name: Apache Syncope CI - Modulo 2

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    - name: Compilazione Pura
      run: mvn clean compile -Dmaven.test.skip=true -Denforcer.skip=true -Dcheckstyle.skip=true -Drat.skip=true
